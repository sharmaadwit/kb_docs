version: '3.8'

services:
  supervisor-agent:
    build:
      context: ../..
      dockerfile: ./local/supervisor/Dockerfile
    container_name: kb-supervisor
    environment:
      # Qwen Proxy Configuration
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://llmproxy.gupshup.io/}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-Qwen3-Coder-480B}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.3}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1500}

      # Langfuse Configuration (for trace fetching)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}

      # Paths
      REPORTS_DIR: /app/local/supervisor/reports
      CACHE_DIR: /app/local/cache
      LOGS_DIR: /app/local/supervisor/logs

      # Analysis Parameters
      MAX_GAPS: ${MAX_GAPS:-10}
      MIN_SEVERITY: ${MIN_SEVERITY:-0.0}

      # LLM Configuration
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-60}

    volumes:
      - ./local/supervisor/reports:/app/local/supervisor/reports
      - ./local/supervisor/logs:/app/local/supervisor/logs
      - ./local/cache:/app/local/cache

    working_dir: /app

    # Resource limits (production-ready)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Restart policy
    restart: "no"

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No network needed (standalone)
    networks:
      - default
